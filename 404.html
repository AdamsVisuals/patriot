<style>
    /* Reset and base styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        text-align: center;
        position: relative;
    }

    /* Hero background with overlay */
    .hero-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3)), 
                    url('images-phase-2/DSC07220.JPG') no-repeat center center/cover;
        z-index: -1;
    }

    /* Main content container */
    .content-container {
        max-width: 800px;
        padding: 2rem;
        z-index: 1;
    }

    /* 404 number styling */
    .error-number {
        font-size: 8rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        margin-bottom: 1rem;
        line-height: 1;
    }

    /* Main message section */
    .main-message {
        margin-bottom: 2.5rem;
    }

    .main-message h2 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #fff;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        font-family: 'Dancing Script', cursive;
    }

    .main-message p {
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
        color: #f0f0f0;
    }

    /* Construction icon */
    .construction-icon {
        font-size: 4rem;
        color: #FFC107;
        margin-bottom: 1.5rem;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    /* Status information */
    .status-info {
        margin-bottom: 2rem;
    }

    .status-info p {
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .status-info i {
        color: #3C4F2A;
    }

    /* Action buttons */
    .action-buttons {
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .btn {
        padding: 12px 25px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
    }

    .primary-btn {
        background-color: #3C4F2A;
        color: white;
        border: none;
    }

    .primary-btn:hover {
        background-color: #3d5F3A;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .secondary-btn {
        background-color: transparent;
        color: white;
        border: 2px solid white;
    }

    .secondary-btn:hover {
        background-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Social links */
    .social-links {
        margin-top: 2rem;
    }

    .social-links p {
        margin-bottom: 1rem;
        color: #f0f0f0;
        font-size: 1rem;
    }

    .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .social-icons a {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1.2rem;
        transition: all 0.3s ease;
        text-decoration: none;
    }

    .social-icons a:hover {
        background-color: #3C4F2A;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .content-container {
            padding: 1.5rem;
        }
        
        .error-number {
            font-size: 6rem;
        }
        
        .main-message h2 {
            font-size: 2rem;
        }
        
        .main-message p {
            font-size: 1rem;
        }
        
        .action-buttons {
            flex-direction: column;
            align-items: center;
        }
        
        .btn {
            width: 220px;
            justify-content: center;
        }
        
        .social-icons {
            gap: 15px;
        }
    }

    @media (max-width: 480px) {
        .error-number {
            font-size: 5rem;
        }
        
        .main-message h2 {
            font-size: 1.8rem;
        }
        
        .construction-icon {
            font-size: 3rem;
        }
        
        .btn {
            padding: 10px 20px;
            width: 200px;
        }
        
        .social-icons a {
            width: 40px;
            height: 40px;
            font-size: 1rem;
        }
    }

    /* Fallback for FontAwesome loading */
    .fas, .fab {
        font-style: normal;
    }
</style>
